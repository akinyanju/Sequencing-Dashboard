server {
  listen 80 default_server;
  listen [::]:80 default_server ipv6only=on;
  server_name ctgenometech03.jax.org www.ctgenometech03.jax.org;
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl;
  server_name ctgenometech03.jax.org www.ctgenometech03.jax.org;
  
  ssl_certificate /etc/httpd/ssl/ctgenometech03.pem;
  ssl_certificate_key /etc/httpd/ssl/ctgenometech03.key;
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
  ssl_prefer_server_ciphers on;
  ssl_ciphers AES256+EECDH:AES256+EDH:!aNULL;
  
  access_log /var/log/nginx/access.log;
  
  # Handle /app path for normal app
  location /app/ {
    proxy_pass http://127.0.0.1:3838/;  # Ensure trailing slash is correct
    proxy_redirect off;
    
    # Set headers for WebSocket and other necessary requests
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    
    proxy_read_timeout 300;
  }
  
  # Handle /appsecure path for secure SSO app
  location /appsecure/ {
    proxy_pass http://127.0.0.1:3838/;  # Ensure trailing slash is correct
    proxy_redirect off;
    
    # Set headers for WebSocket and other necessary requests
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    
    proxy_read_timeout 300;
  }
  
  # Default location if no other location matched
  location / {
    root /var/www/html;
  }
  location /multiqc_reports/ {
    alias /srv/shiny-server/.InputDatabase/multiqc_reports/;
    autoindex on;  # optional, to list directory files if needed
  }
  # -------- Projects site (static) --------
  location /projects/ {
    alias /var/www/html/projects/;
    
    index index.html;
    
    # Allow embedding from Shiny (same origin)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    
    # Log access
    access_log /var/log/nginx/projects_access.log;
    
    # Block sensitive files
    location ~ \.(git|env|sql|bak|log)$ {
      deny all;
    }
  }
  # -------- Delivery site (static + logging) --------
  location /delivery/ {
    alias /var/www/html/delivery/;
    
    index index.html;
    
    # IMPORTANT: handle deep links / sidebar navigation
    try_files $uri $uri/ /index.html;
    
    # Logging for Wiki / Delivery tracking
    access_log /srv/shiny-server/log/wikiTracker_log.csv wiki_csv;
    
    # Allow embedding if needed elsewhere (safe)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    
    # Basic hardening
    location ~ \.(git|env|sql|bak|log)$ {
      deny all;
    }
  }
}